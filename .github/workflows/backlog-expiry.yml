name: backlog-expiry

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 10
          days-before-issue-close: 4
          stale-issue-label: expiring
          stale-issue-message: >-
            No activity for 10 days. Closes in 4 more unless touched — per the
            intake rule, expiry is the system working, not a loss.
          close-issue-message: >-
            Expired unworked. If this genuinely matters, it will bleed again
            in real work and can be refiled with that evidence.
          exempt-issue-labels: "severity:P1,severity:P2,standing"
          days-before-pr-stale: -1
          days-before-pr-close: -1
          operations-per-run: 100
